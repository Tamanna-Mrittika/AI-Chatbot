# Static analysis configuration.
#
# On top of `flutter_lints`, this project enables a stricter set of rules that
# catch the classes of mistake most likely to appear in an async, streaming app:
# forgotten awaits, silently swallowed futures and implicit dynamic casts.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**

  language:
    strict-casts: true
    strict-raw-types: true

  errors:
    # An unawaited future in a stream controller is almost always a bug.
    unawaited_futures: error
    # Keep the codebase free of stray debugging output.
    avoid_print: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_parenthesis
    - use_super_parameters
